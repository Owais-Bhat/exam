<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SI-Prep · JKSSB Sub-Inspector Trainer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='none' stroke='%23FF9F45' stroke-width='12'/><circle cx='50' cy='50' r='16' fill='%23FF9F45'/></svg>">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="app-root">
  <!-- Left rail (desktop) / bottom bar (mobile) -->
  <nav id="rail" aria-label="Main">
    <div class="rail-brand" title="SI-Prep">
      <svg viewBox="0 0 100 100" class="brand-mark" aria-hidden="true">
        <circle cx="50" cy="50" r="38" fill="none" stroke="currentColor" stroke-width="10"/>
        <circle cx="50" cy="50" r="15" fill="currentColor"/>
      </svg>
      <span class="rail-brand-name">SI-Prep</span>
    </div>
    <a href="#/" data-nav="dash" class="rail-link" aria-label="Dashboard">
      <svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Home</span>
    </a>
    <a href="#/practice" data-nav="practice" class="rail-link" aria-label="Practice">
      <svg viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      <span>Practice</span>
    </a>
    <a href="#/mock" data-nav="mock" class="rail-link" aria-label="Mock exam">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>
      <span>Mock</span>
    </a>
    <a href="#/revise" data-nav="revise" class="rail-link" aria-label="Revise">
      <svg viewBox="0 0 24 24"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.5 9A9 9 0 0 0 5.6 5.6L1 10m22 4-4.6 4.4A9 9 0 0 1 3.5 15"/></svg>
      <span>Revise</span>
      <em id="rail-due-badge" class="rail-badge" hidden></em>
    </a>
    <a href="#/lessons" data-nav="lessons" class="rail-link" aria-label="Lessons">
      <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      <span>Lessons</span>
    </a>
    <a href="#/stats" data-nav="stats" class="rail-link" aria-label="Progress">
      <svg viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
      <span>Progress</span>
    </a>
    <button id="theme-toggle" class="rail-link rail-btn" aria-label="Toggle theme">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.2 4.2l1.4 1.4m12.8 12.8 1.4 1.4M1 12h2m18 0h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
      <span>Theme</span>
    </button>
  </nav>

  <main id="view" tabindex="-1"></main>
</div>

<div id="toast-holder" aria-live="polite"></div>

<!-- Data (question banks register into window.BANK) -->
<script src="data/taxonomy.js"></script>
<script src="data/bank-reasoning.js"></script>
<script src="data/bank-ga.js"></script>
<script src="data/bank-quant.js"></script>
<script src="data/bank-english.js"></script>
<script src="data/bank-math.js"></script>
<script src="data/bank-computer.js"></script>
<script src="data/lessons-data.js"></script>

<!-- Core -->
<script src="js/store.js"></script>
<script src="js/srs.js"></script>
<script src="js/gamify.js"></script>
<script src="js/engine.js"></script>

<!-- Views -->
<script src="js/views/dashboard.js"></script>
<script src="js/views/practice.js"></script>
<script src="js/views/mock.js"></script>
<script src="js/views/revise.js"></script>
<script src="js/views/lessons.js"></script>
<script src="js/views/stats.js"></script>

<script src="js/app.js"></script>
</body>
</html>
