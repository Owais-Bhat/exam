<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SI-Prep · JKSSB Sub-Inspector Syllabus Mission</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='none' stroke='%23FF9F45' stroke-width='12'/><circle cx='50' cy='50' r='16' fill='%23FF9F45'/></svg>">

<!-- Modern Typography: Outfit (Headings), Plus Jakarta Sans (Body), JetBrains Mono (Numbers/Code) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="app-root">
  <!-- Left rail (desktop) / bottom bar (mobile) -->
  <nav id="rail" aria-label="Main Navigation">
    <div class="rail-brand" title="SI-Prep Exam OS">
      <div class="brand-glow"></div>
      <svg viewBox="0 0 100 100" class="brand-mark" aria-hidden="true">
        <circle cx="50" cy="50" r="38" fill="none" stroke="currentColor" stroke-width="9"/>
        <circle cx="50" cy="50" r="16" fill="currentColor"/>
      </svg>
      <span class="rail-brand-name">SI-Prep</span>
    </div>

    <a href="#/" data-nav="dash" class="rail-link" aria-label="Dashboard">
      <svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Home</span>
    </a>

    <a href="#/masterclass" data-nav="masterclass" class="rail-link rail-link-star" aria-label="Masterclass Hub">
      <div class="star-glow"></div>
      <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      <span>Masterclass</span>
      <span class="rail-badge rail-badge-cyan">17D</span>
    </a>

    <a href="#/ai-coach" data-nav="ai_coach" class="rail-link rail-link-ai" aria-label="AI Exam Coach">
      <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Z"/><path d="M12 8v4M12 16h.01"/></svg>
      <span>AI Coach</span>
    </a>

    <a href="#/practice" data-nav="practice" class="rail-link" aria-label="Practice">
      <svg viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      <span>Practice</span>
    </a>

    <a href="#/mock" data-nav="mock" class="rail-link" aria-label="Mock exam">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>
      <span>Mock</span>
    </a>

    <a href="#/revise" data-nav="revise" class="rail-link" aria-label="Revise">
      <svg viewBox="0 0 24 24"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.5 9A9 9 0 0 0 5.6 5.6L1 10m22 4-4.6 4.4A9 9 0 0 1 3.5 15"/></svg>
      <span>Revise</span>
      <em id="rail-due-badge" class="rail-badge" hidden></em>
    </a>

    <a href="#/lessons" data-nav="lessons" class="rail-link" aria-label="Lessons">
      <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      <span>Lessons</span>
    </a>

    <a href="#/stats" data-nav="stats" class="rail-link" aria-label="Progress">
      <svg viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
      <span>Progress</span>
    </a>

    <button id="theme-toggle" class="rail-link rail-btn" aria-label="Toggle theme">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.2 4.2l1.4 1.4m12.8 12.8 1.4 1.4M1 12h2m18 0h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
      <span>Theme</span>
    </button>
  </nav>

  <!-- Main View Container with Top Status Bar -->
  <div id="content-pane">
    <header id="topbar">
      <div class="topbar-left">
        <span class="topbar-tag">JKSSB SI · HOME DEPT</span>
        <span class="topbar-sub">Target: 95% (190+/200)</span>
      </div>
      <div class="topbar-center">
        <a href="#/masterclass" class="topbar-pill">
          <span class="pill-dot"></span>
          <span id="top-active-plan"><b>Active:</b> 17-day syllabus mission · Deadline 10 November</span>
        </a>
      </div>
      <div class="topbar-right">
        <a href="#/ai-coach" class="topbar-badge badge-ai" title="Gemini and OpenAI exam coach">
          <span class="badge-dot-green"></span>
          <span>Dual AI Coach</span>
        </a>
        <div class="topbar-badge" title="Daily study streak">
          <span class="flame">🔥</span>
          <span id="top-streak-count" class="num">1d</span>
        </div>
        <div class="topbar-badge" title="Total XP & Rank">
          <span class="bolt">⚡</span>
          <span id="top-xp-count" class="num">0 XP · Recruit</span>
        </div>
      </div>
    </header>

    <main id="view" tabindex="-1"></main>
  </div>
</div>

<div id="toast-holder" aria-live="polite"></div>

<!-- Data (question banks register into window.BANK) -->
<script src="data/taxonomy.js"></script>
<script src="data/bank-reasoning.js"></script>
<script src="data/bank-ga.js"></script>
<script src="data/bank-quant.js"></script>
<script src="data/bank-english.js"></script>
<script src="data/bank-math.js"></script>
<script src="data/bank-computer.js"></script>
<script src="data/lessons-data.js"></script>
<script src="data/study-plan.js?v=3"></script>

<!-- Core Engines -->
<script src="js/store.js?v=2"></script>
<script src="js/srs.js?v=2"></script>
<script src="js/gamify.js?v=2"></script>
<script src="js/engine.js?v=2"></script>
<script src="js/masterclass.js?v=2"></script>
<script src="js/ai_coach.js?v=2"></script>

<!-- Views -->
<script src="js/views/dashboard.js?v=2"></script>
<script src="js/views/masterclass.js?v=3"></script>
<script src="js/views/ai_coach.js?v=2"></script>
<script src="js/views/practice.js?v=2"></script>
<script src="js/views/mock.js?v=2"></script>
<script src="js/views/revise.js?v=2"></script>
<script src="js/views/lessons.js?v=2"></script>
<script src="js/views/stats.js?v=2"></script>

<script src="js/app.js?v=2"></script>
</body>
</html>
